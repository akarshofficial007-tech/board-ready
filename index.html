<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a classroom chalkboard on top carrying the day's one line and one topic;
   below it, a ruled notebook page for the work. One column, phone first, tabs at the thumb. */
:root{
  --paper:#eef0ea; --card:#fbfcf8; --ink:#1d2a24; --muted:#5a695f; --rule:#cfd6cc;
  --board:#23382f; --board-edge:#1a2b24; --chalk:#f3f1e6; --chalk-dim:#b9c6ba;
  --marigold:#d99208; --marigold-ink:#3a2700; --ledge:#8a5a2b;
  --good:#2c7a4c; --warn:#b04f10; --good-bg:#e2f1e6; --warn-bg:#f8e7d8;
  --display:"Kalam","Mukta","Noto Sans Devanagari",cursive;
  --body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131e19; --card:#1b2a23; --ink:#e8ecdf; --muted:#9db0a3; --rule:#2e4338;
    --board:#294237; --board-edge:#0d1612; --chalk:#f3f1e6; --chalk-dim:#b3c2b5;
    --marigold:#f0b53a; --marigold-ink:#2b1d00; --ledge:#6f4a25;
    --good:#6fc48d; --warn:#f09a5c; --good-bg:#1f3a2a; --warn-bg:#3d2a1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131e19; --card:#1b2a23; --ink:#e8ecdf; --muted:#9db0a3; --rule:#2e4338;
  --board:#294237; --board-edge:#0d1612; --chalk:#f3f1e6; --chalk-dim:#b3c2b5;
  --marigold:#f0b53a; --marigold-ink:#2b1d00; --ledge:#6f4a25;
  --good:#6fc48d; --warn:#f09a5c; --good-bg:#1f3a2a; --warn-bg:#3d2a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:92px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

/* ---------- the board ---------- */
.board{background:
    radial-gradient(120% 80% at 20% 10%,rgba(255,255,255,.07),transparent 60%),
    radial-gradient(90% 60% at 85% 90%,rgba(255,255,255,.05),transparent 60%),
    var(--board);
  color:var(--chalk);border:6px solid var(--board-edge);border-bottom:0;border-radius:10px 10px 0 0;
  margin-top:16px;padding:18px 18px 22px;position:relative}
.ledge{height:12px;background:linear-gradient(var(--ledge),color-mix(in srgb,var(--ledge) 70%,#000));border-radius:0 0 6px 6px;position:relative;margin-bottom:20px}
.ledge::after{content:"";position:absolute;right:26px;top:-5px;width:34px;height:7px;border-radius:3px;background:var(--chalk);box-shadow:-46px 1px 0 -1px var(--marigold)}
.board .meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--chalk-dim);letter-spacing:.02em}
.board .line{font-family:var(--display);font-size:25px;line-height:1.35;margin:12px 0 4px;font-weight:400}
.board .gloss{font-size:13.5px;color:var(--chalk-dim);margin:0 0 14px}
.board .topic-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--marigold)}
.board .topic{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.3;margin-top:2px}
.board .tally{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--chalk-dim)}
@media (prefers-reduced-motion:no-preference){
  .board .line{animation:write 1.1s ease-out both}
  @keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
}

/* ---------- notebook ---------- */
.sec-title{font-family:var(--display);font-weight:700;font-size:20px;margin:22px 0 2px}
.sec-sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.block{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:8px;padding:12px}
.block.done{border-left-color:var(--good)}
.block.running{border-left-color:var(--marigold)}
.tick{width:44px;height:44px;border-radius:8px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{width:26px;height:26px;stroke:var(--good);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg)}
.tick[aria-pressed="true"] svg{opacity:1}
.block h3{font-size:16px;font-weight:600}
.block .hi{font-family:var(--display);color:var(--muted);font-size:14px;font-weight:400;margin-left:6px}
.block p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.timer{min-width:74px;min-height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:0 10px}
.block.running .timer{background:var(--marigold);color:var(--marigold-ink);border-color:var(--marigold)}
.note{font-size:13.5px;color:var(--muted);margin:12px 2px 0}
.kept{display:flex;gap:10px;align-items:baseline;margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--good-bg);color:var(--ink)}
.kept b{font-family:var(--display);font-size:24px;color:var(--good)}

.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.gold{background:var(--marigold);border-color:var(--marigold);color:var(--marigold-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--rule);background:var(--card);font-weight:500;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--board);color:var(--chalk);border-color:var(--board)}

/* plan */
details.week{background:var(--card);border:1px solid var(--rule);border-radius:8px}
details.week[data-now]{border-color:var(--marigold);box-shadow:inset 4px 0 0 var(--marigold)}
details.week summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer;min-height:48px}
details.week summary::-webkit-details-marker{display:none}
details.week summary b{font-family:var(--display);font-size:18px}
details.week summary span{color:var(--muted);font-size:13.5px;text-align:right}
.week-body{padding:0 14px 14px;border-top:1px dashed var(--rule)}
.week-body ol{margin:10px 0 8px;padding-left:22px}
.week-body li{margin:3px 0}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:14.5px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* practice */
.q{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.q .tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q h3{font-size:16.5px;font-weight:600;margin:4px 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:46px;padding:8px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.opt:disabled{cursor:default;opacity:1}
.why{margin:10px 0 0;font-size:14.5px;padding:10px 12px;border-radius:8px;background:var(--paper)}
pre.code{margin:0 0 10px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--rule);font:14px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;white-space:pre;overflow-x:auto}
.why b{color:var(--good)} .why.miss b{color:var(--warn)}

/* log */
label{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);padding:8px 10px}
textarea{min-height:72px;resize:vertical}
.entry{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px}
.entry.due{border-left:4px solid var(--marigold)}
.entry h3{font-size:16px;font-weight:600}
.entry .small{font-size:13.5px;color:var(--muted)}
.entry p{margin:6px 0 8px;font-size:14.5px}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:12px;border:1px solid var(--rule);margin-right:6px;font-variant-numeric:tabular-nums}
.pill.due{background:var(--marigold);color:var(--marigold-ink);border-color:var(--marigold)}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:118px 1fr 28px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--board);min-width:2px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
svg.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}

/* board practice */
.stage{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
.stage.on{border-color:var(--marigold);box-shadow:inset 4px 0 0 var(--marigold)}
.stage .min{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.rub{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.rub:last-child{border-bottom:0}
.rub b{font-weight:600} .rub small{display:block;color:var(--muted);font-size:13.5px}
.marks{display:flex;gap:4px}
.marks button{width:38px;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.marks button[aria-pressed="true"]{background:var(--board);color:var(--chalk);border-color:var(--board)}
.bigclock{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);z-index:5}
nav.tabs div{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:500;border-top:3px solid transparent;margin-top:-1px}
nav.tabs a i{font-style:normal;font-family:var(--display);font-size:16px;line-height:1.2;color:inherit}
nav.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--marigold)}
footer{margin:28px 0 8px;font-size:13px;color:var(--muted);text-align:left}
footer .from{font-family:var(--display);font-size:16px;color:var(--ink);display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:88%}
[hidden]{display:none!important}
</style>
</head>

 {"id": "w1-cs-08", "k": 1, "s": "CS", "t": "Memory units", "q": "A nibble is a group of", "o": ["4 bits", "8 bits", "16 bits", "2 bits"], "a": 0, "w": "A nibble is 4 bits, half a byte."},
 {"id": "w1-cs-09", "k": 1, "s": "CS", "t": "Memory units", "q": "2 GB of memory equals how many bytes?", "o": ["2²⁰", "2³¹", "2³⁰", "2³²"], "a": 1, "w": "1 GB = 2³⁰ bytes, so 2 GB = 2 × 2³⁰ = 2³¹."},
 {"id": "w1-cs-10", "k": 1, "s": "CS", "t": "Boolean logic", "q": "By De Morgan's law, (A + B)′ equals", "o": ["(A · B)′", "A · B", "A′ · B′", "A′ + B′"], "a": 2, "w": "The complement of a sum is the product of the complements."},
 {"id": "w1-cs-11", "k": 1, "s": "CS", "t": "Boolean logic", "q": "Which gate gives output 1 only when its two inputs differ?", "o": ["NOR", "AND", "OR", "XOR"], "a": 3, "w": "XOR is the 'either, not both' gate."},
 {"id": "w1-cs-12", "k": 1, "s": "CS", "t": "Boolean logic", "q": "Which pair are called universal gates?", "o": ["AND and OR", "XOR and XNOR", "NAND and NOR", "NOT and OR"], "a": 2, "w": "Any circuit can be built from NAND alone or NOR alone."},
 {"id": "w1-cs-13", "k": 1, "s": "CS", "t": "Boolean logic", "q": "A + A · B simplifies to", "o": ["A · B", "A", "A + B", "B"], "a": 1, "w": "Absorption law: A(1 + B) = A · 1 = A."},
 {"id": "w1-cs-14", "k": 1, "s": "CS", "t": "Boolean logic", "q": "The expression for A XOR B is", "o": ["(A + B)′", "A′B + AB′", "AB + A′B′", "A′ + B′"], "a": 1, "w": "XOR is 1 when exactly one input is 1: A′B or AB′. The option AB + A′B′ is XNOR."},
 {"id": "w1-cs-15", "k": 1, "s": "CS", "t": "Boolean logic", "q": "The minimum number of 2-input NAND gates needed to build an OR gate is", "o": ["3", "4", "1", "2"], "a": 0, "w": "Two NANDs invert A and B; a third NAND of A′ and B′ gives A + B."},
 {"id": "w1-cs-16", "k": 1, "s": "CS", "t": "Boolean logic", "q": "The complement of A·B + C is", "o": ["A′·B′·C′", "(A′ + B′) · C′", "A′·B′ + C′", "(A′ + B′) + C′"], "a": 1, "w": "Apply De Morgan twice: (AB + C)′ = (AB)′ · C′ = (A′ + B′) · C′."},
 {"id": "w1-cs-17", "k": 1, "s": "CS", "t": "Boolean logic", "q": "A truth table for 4 input variables has how many rows?", "o": ["8", "32", "4", "16"], "a": 3, "w": "Each variable doubles the rows: 2⁴ = 16."},
 {"id": "w1-cs-18", "k": 1, "s": "CS", "t": "Computer system", "q": "Which memory loses its contents when power is switched off?", "o": ["Flash drive", "Hard disk", "RAM", "ROM"], "a": 2, "w": "RAM is volatile; the others retain data."},
 {"id": "w1-cs-19", "k": 1, "s": "CS", "t": "Computer system", "q": "The part of the CPU that performs arithmetic and comparisons is the", "o": ["ALU", "Control Unit", "Register", "Cache"], "a": 0, "w": "ALU stands for Arithmetic and Logic Unit."},
 {"id": "w1-cs-20", "k": 1, "s": "CS", "t": "Computer system", "q": "Cache memory is placed between", "o": ["the CPU and main memory", "the CPU and the keyboard", "ROM and the hard disk", "main memory and the hard disk"], "a": 0, "w": "Cache holds what the CPU needs next, so it sits between the CPU and RAM."},
 {"id": "w1-cs-21", "k": 1, "s": "CS", "t": "Architecture (TGT)", "q": "Which register holds the address of the next instruction to be fetched?", "o": ["Accumulator", "Instruction Register", "Program Counter", "Memory Data Register"], "a": 2, "w": "The Program Counter points to the next instruction; the Instruction Register holds the current one."},
 {"id": "w1-cs-22", "k": 1, "s": "CS", "t": "Architecture (TGT)", "q": "Which statement describes a RISC processor?", "o": ["Many complex, variable-length instructions", "Many addressing modes and microcoded control", "Instructions that take many cycles each", "Few, simple, fixed-length instructions"], "a": 3, "w": "RISC keeps instructions few, simple and of one length; the other three describe CISC."},
 {"id": "w1-cs-23", "k": 1, "s": "CS", "t": "Architecture (TGT)", "q": "The address bus of a computer is", "o": ["unidirectional, from the CPU to memory", "bidirectional, between CPU and memory", "used only for control signals", "unidirectional, from memory to the CPU"], "a": 0, "w": "Only the CPU sends addresses, so the address bus runs one way. The data bus is bidirectional."},
 {"id": "w1-cs-24", "k": 1, "s": "CS", "t": "Architecture (TGT)", "q": "An instruction that names no operand address, as on a stack machine, is called", "o": ["a zero-address instruction", "an immediate instruction", "a two-address instruction", "a one-address instruction"], "a": 0, "w": "A stack machine takes operands from the top of the stack, so the instruction carries no address."},
 {"id": "w1-cs-25", "k": 1, "s": "CS", "t": "Encoding", "q": "Standard ASCII is a 7-bit code. How many characters can it represent?", "o": ["512", "64", "128", "256"], "a": 2, "w": "2 to the power 7 is 128."},
 {"id": "w1-cs-26", "k": 1, "s": "CS", "t": "Encoding", "q": "In UTF-8, one character is stored in", "o": ["exactly 4 bytes", "exactly 1 byte", "exactly 2 bytes", "1 to 4 bytes"], "a": 3, "w": "UTF-8 is variable-length: 1 to 4 bytes per character."},
 {"id": "w1-cs-27", "k": 1, "s": "CS", "t": "Encoding", "q": "ISCII, the code for Indian scripts, uses", "o": ["32 bits", "8 bits", "7 bits", "16 bits"], "a": 1, "w": "ISCII is an 8-bit code: the lower half is ASCII, the upper half carries Indian scripts."},
 {"id": "w1-ped-01", "k": 1, "s": "Pedagogy", "t": "Piaget", "q": "According to Piaget, a child of 7 to 11 years is in the", "o": ["Pre-operational stage", "Formal operational stage", "Concrete operational stage", "Sensorimotor stage"], "a": 2, "w": "Logical thinking about concrete objects appears from about 7 to 11."},
 {"id": "w1-ped-02", "k": 1, "s": "Pedagogy", "t": "Piaget", "q": "Object permanence develops in the", "o": ["Pre-operational stage", "Sensorimotor stage", "Formal operational stage", "Concrete operational stage"], "a": 1, "w": "It forms during the first two years, the sensorimotor stage."},
 {"id": "w1-ped-03", "k": 1, "s": "Pedagogy", "t": "Piaget", "q": "A child calls a zebra 'a horse' because it fits what she already knows. Piaget calls this", "o": ["accommodation", "conservation", "equilibration", "assimilation"], "a": 3, "w": "Assimilation fits the new into an existing schema; accommodation changes the schema."},
 {"id": "w1-ped-04", "k": 1, "s": "Pedagogy", "t": "Piaget", "q": "A child understands that water poured into a taller glass is still the same amount. This ability is", "o": ["animism", "conservation", "egocentrism", "centration"], "a": 1, "w": "Conservation appears in the concrete operational stage."},
 {"id": "w1-ped-05", "k": 1, "s": "Pedagogy", "t": "Vygotsky", "q": "The Zone of Proximal Development was proposed by", "o": ["Vygotsky", "Skinner", "Piaget", "Bruner"], "a": 0, "w": "ZPD is the gap between what a child does alone and with help. It is Vygotsky's idea."},
 {"id": "w1-ped-06", "k": 1, "s": "Pedagogy", "t": "Vygotsky", "q": "Scaffolding in teaching means", "o": ["Grouping by ability", "Testing at the end of a unit", "Temporary support that is withdrawn gradually", "Giving the full answer"], "a": 2, "w": "Support is given, then removed as the learner becomes independent."},
 {"id": "w1-ped-07", "k": 1, "s": "Pedagogy", "t": "Vygotsky", "q": "For Vygotsky, a child talking to herself while solving a puzzle is", "o": ["using private speech to guide her thinking", "avoiding the task", "imitating the teacher", "showing egocentric immaturity"], "a": 0, "w": "Vygotsky saw private speech as a tool for self-regulation; Piaget read it as egocentric."},
 {"id": "w1-ped-08", "k": 1, "s": "Pedagogy", "t": "Kohlberg", "q": "A child obeys a rule only to avoid punishment. In Kohlberg's theory this is the", "o": ["Formal level", "Conventional level", "Post-conventional level", "Pre-conventional level"], "a": 3, "w": "Punishment and obedience orientation is stage 1, pre-conventional."},
 {"id": "w1-ped-09", "k": 1, "s": "Pedagogy", "t": "Kohlberg", "q": "'I follow the rule so that my teacher thinks I am a good girl.' This reasoning belongs to the", "o": ["Conventional level", "Sensorimotor stage", "Post-conventional level", "Pre-conventional level"], "a": 0, "w": "Seeking approval, the 'good boy, nice girl' stage, is conventional."},
 {"id": "w1-ped-10", "k": 1, "s": "Pedagogy", "t": "Development", "q": "Development that proceeds from the head downward to the feet is called", "o": ["proximodistal", "differential", "sequential", "cephalocaudal"], "a": 3, "w": "Cephalocaudal means head to tail; proximodistal means centre outward."},
 {"id": "w1-eng-01", "k": 1, "s": "English", "t": "Subject-verb agreement", "q": "Find the error: 'Each of the students / have submitted / the assignment / on time.'", "o": ["Each of the students", "have submitted", "the assignment", "on time"], "a": 1, "w": "'Each' takes a singular verb: has submitted."},
 {"id": "w1-eng-02", "k": 1, "s": "English", "t": "Vocabulary", "q": "Choose the word closest in meaning to 'meticulous'.", "o": ["Generous", "Hasty", "Thorough", "Careless"], "a": 2, "w": "Meticulous means very careful about detail."},
 {"id": "w1-eng-03", "k": 1, "s": "English", "t": "Prepositions", "q": "She is good ___ mathematics.", "o": ["with", "on", "in", "at"], "a": 3, "w": "The fixed pair is 'good at'."},
 {"id": "w1-eng-04", "k": 1, "s": "English", "t": "Voice", "q": "Passive of 'The teacher explained the lesson.'", "o": ["The lesson was explained by the teacher.", "The lesson has explained the teacher.", "The lesson is explained by the teacher.", "The lesson was being explained by the teacher."], "a": 0, "w": "Simple past active becomes was/were + past participle."},
 {"id": "w1-eng-05", "k": 1, "s": "English", "t": "Vocabulary", "q": "Choose the opposite of 'scarce'.", "o": ["Rare", "Abundant", "Tiny", "Costly"], "a": 1, "w": "Scarce means in short supply; abundant is its opposite."},
 {"id": "w1-hin-01", "k": 1, "s": "Hindi", "t": "संधि", "q": "'विद्यालय' का संधि-विच्छेद है", "o": ["विद् + आलय", "विद्य + आलय", "विद्या + आलय", "विद्या + लय"], "a": 2, "w": "आ + आ = आ, दीर्घ संधि: विद्या + आलय।"},
 {"id": "w1-hin-02", "k": 1, "s": "Hindi", "t": "विलोम", "q": "'अंधकार' का विलोम शब्द है", "o": ["प्रकाश", "रात्रि", "छाया", "तिमिर"], "a": 0, "w": "तिमिर पर्यायवाची है; विलोम प्रकाश है।"},
 {"id": "w1-hin-03", "k": 1, "s": "Hindi", "t": "मुहावरे", "q": "'आँखों का तारा' मुहावरे का अर्थ है", "o": ["बहुत तेज़", "बहुत प्यारा", "बहुत दूर", "बहुत चालाक"], "a": 1, "w": "जो बहुत प्रिय हो, वह आँखों का तारा।"},
 {"id": "w1-hin-04", "k": 1, "s": "Hindi", "t": "वर्तनी", "q": "शुद्ध वर्तनी चुनिए", "o": ["आर्शीवाद", "आशिर्वाद", "आशीरवाद", "आशीर्वाद"], "a": 3, "w": "सही रूप है आशीर्वाद: आशीः + वाद।"},
 {"id": "w1-hin-05", "k": 1, "s": "Hindi", "t": "पर्यायवाची", "q": "'कमल' का पर्यायवाची है", "o": ["जलचर", "जलज", "जलद", "जलधि"], "a": 1, "w": "जलज = जल में जन्मा, कमल। जलद बादल, जलधि समुद्र।"},
 {"id": "w1-rea-01", "k": 1, "s": "Reasoning", "t": "Series", "q": "3, 8, 15, 24, 35, ?", "o": ["47", "46", "49", "48"], "a": 3, "w": "Each term is a square minus 1: 4, 9, 16, 25, 36, then 49 − 1 = 48."},
 {"id": "w1-rea-02", "k": 1, "s": "Reasoning", "t": "Coding", "q": "If CAT is written as DBU, then DOG is written as", "o": ["DPH", "EPG", "EPH", "FPH"], "a": 2, "w": "Each letter moves one step forward: D→E, O→P, G→H."},
 {"id": "w1-rea-03", "k": 1, "s": "Reasoning", "t": "Direction", "q": "A man walks 5 km north, turns right and walks 3 km, turns right again and walks 5 km. Where is he from the start?", "o": ["3 km to the east", "At the starting point", "13 km to the east", "3 km to the west"], "a": 0, "w": "North and south cancel out; only the 3 km to the east remains."},
 {"id": "w1-rea-04", "k": 1, "s": "Reasoning", "t": "Blood relations", "q": "Pointing to a boy, Rina says, 'He is the son of my mother's only daughter.' The boy is Rina's", "o": ["cousin", "son", "nephew", "brother"], "a": 1, "w": "Her mother's only daughter is Rina herself, so the boy is her son."},
 {"id": "w1-rea-05", "k": 1, "s": "Reasoning", "t": "Odd one out", "q": "Find the odd one out: 27, 64, 125, 144", "o": ["64", "125", "144", "27"], "a": 2, "w": "27, 64 and 125 are cubes of 3, 4 and 5; 144 is a square, not a cube."},
 {"id": "w1-num-01", "k": 1, "s": "Numerical", "t": "Percentage", "q": "15% of 240 is", "o": ["24", "32", "40", "36"], "a": 3, "w": "10% is 24 and 5% is 12; together 36."},
 {"id": "w1-num-02", "k": 1, "s": "Numerical", "t": "Ratio", "q": "Two numbers are in the ratio 3 : 5 and their sum is 64. The larger number is", "o": ["24", "45", "35", "40"], "a": 3, "w": "8 parts make 64, so one part is 8; the larger is 5 × 8 = 40."},
 {"id": "w1-num-03", "k": 1, "s": "Numerical", "t": "Average", "q": "The average of 5 numbers is 18. When one number is removed, the average of the rest is 16. The removed number is", "o": ["26", "20", "28", "24"], "a": 0, "w": "Total 90; the remaining four total 64; 90 − 64 = 26."},
 {"id": "w1-num-04", "k": 1, "s": "Numerical", "t": "Time and work", "q": "A finishes a job in 12 days and B in 6 days. Working together they finish it in", "o": ["9 days", "4 days", "18 days", "3 days"], "a": 1, "w": "In one day they do 1/12 + 1/6 = 1/4 of the job, so 4 days."},
 {"id": "w1-num-05", "k": 1, "s": "Numerical", "t": "Profit and loss", "q": "An article bought for ₹400 is sold for ₹460. The profit per cent is", "o": ["11.5%", "60%", "15%", "13%"], "a": 2, "w": "Profit 60 on a cost of 400: 60/400 = 15%."},
 {"id": "w1-gk-01", "k": 1, "s": "GK", "t": "Education policy", "q": "The school structure proposed by NEP 2020 is", "o": ["5 + 3 + 2 + 2", "4 + 4 + 4", "5 + 3 + 3 + 4", "10 + 2"], "a": 2, "w": "Foundational 5, Preparatory 3, Middle 3, Secondary 4."},
 {"id": "w1-gk-02", "k": 1, "s": "GK", "t": "Constitution", "q": "Which Article of the Constitution makes education a fundamental right for children of 6 to 14 years?", "o": ["Article 51A", "Article 21A", "Article 14", "Article 45"], "a": 1, "w": "Article 21A was inserted by the 86th Amendment, 2002."},
 {"id": "w1-gk-03", "k": 1, "s": "GK", "t": "AEES", "q": "The Atomic Energy Education Society works under the", "o": ["Department of Atomic Energy", "Ministry of Education", "Department of Space", "Ministry of Defence"], "a": 0, "w": "AEES is an autonomous body of the Department of Atomic Energy."},
 {"id": "w1-gk-04", "k": 1, "s": "GK", "t": "Science in India", "q": "Who is regarded as the father of India's nuclear programme?", "o": ["C. V. Raman", "Vikram Sarabhai", "A. P. J. Abdul Kalam", "Homi J. Bhabha"], "a": 3, "w": "Homi Bhabha founded the programme; Sarabhai is linked with the space programme."},
 {"id": "w1-gk-05", "k": 1, "s": "GK", "t": "Days", "q": "National Education Day is observed on", "o": ["11 November", "14 November", "5 September", "28 February"], "a": 0, "w": "It marks the birth anniversary of Maulana Abul Kalam Azad."},
 {"id": "w1-lit-01", "k": 1, "s": "Literacy", "t": "Shortcuts", "q": "The keyboard shortcut to undo the last action is", "o": ["Ctrl + Y", "Ctrl + X", "Ctrl + U", "Ctrl + Z"], "a": 3, "w": "Ctrl + Z undoes; Ctrl + Y redoes."},
 {"id": "w1-lit-02", "k": 1, "s": "Literacy", "t": "Spreadsheet", "q": "In a spreadsheet, the reference $A$1 is", "o": ["a circular reference", "an absolute reference", "a relative reference", "a mixed reference"], "a": 1, "w": "Both the column and the row are locked by $, so it does not change when copied."},
 {"id": "w1-lit-03", "k": 1, "s": "Literacy", "t": "Presentation", "q": "The default file extension of a PowerPoint presentation is", "o": [".docx", ".pptx", ".xlsx", ".ppsm"], "a": 1, "w": ".pptx is the presentation; .xlsx is a workbook and .docx a document."},
 {"id": "w1-lit-04", "k": 1, "s": "Literacy", "t": "Email", "q": "In an email, the addresses placed in BCC are", "o": ["blocked from replying", "shown to every recipient", "hidden from the other recipients", "sent a copy one day later"], "a": 2, "w": "BCC is blind carbon copy: the others cannot see those addresses."},
 {"id": "w1-lit-05", "k": 1, "s": "Literacy", "t": "Word processing", "q": "Sending one letter to many people with each name filled in automatically is done by", "o": ["mail merge", "autocorrect", "track changes", "macros"], "a": 0, "w": "Mail merge joins one letter with a list of names and addresses."},
 {"id": "w2-cs-01", "k": 2, "s": "CS", "t": "Operators", "q": "What is printed?", "c": "print(7 // 2, -7 // 2)", "o": ["3 -3", "3 -4", "3.5 -3.5", "4 -4"], "a": 1, "w": "// floors toward minus infinity: 7//2 is 3 and -7//2 is -4, not -3."},
 {"id": "w2-cs-02", "k": 2, "s": "CS", "t": "Operators", "q": "What is printed?", "c": "print(2 ** 3 ** 2)", "o": ["64", "72", "256", "512"], "a": 3, "w": "** groups from the right: 3**2 is 9, then 2**9 is 512."},
 {"id": "w2-cs-03", "k": 2, "s": "CS", "t": "Operators", "q": "What is printed?", "c": "print(10 % 3 * 2)", "o": ["0", "2", "1", "4"], "a": 1, "w": "% and * have the same precedence and run left to right: (10 % 3) * 2 = 1 * 2."},
 {"id": "w2-cs-04", "k": 2, "s": "CS", "t": "Operators", "q": "What is printed?", "c": "print(not True or True and False)", "o": ["True", "None", "Error", "False"], "a": 3, "w": "not binds first, then and, then or: (not True) or (True and False) = False or False."},
 {"id": "w2-cs-05", "k": 2, "s": "CS", "t": "Operators", "q": "What is printed?", "c": "print(1 < 2 < 1)", "o": ["True", "1", "False", "Error"], "a": 2, "w": "A chained comparison means (1 < 2) and (2 < 1); the second part is False."},
 {"id": "w2-cs-06", "k": 2, "s": "CS", "t": "Operators", "q": "What is printed?", "c": "print(round(2.5), round(3.5))", "o": ["2 4", "3 4", "2 3", "3 3"], "a": 0, "w": "Python rounds a .5 to the nearest even number: 2.5 → 2 and 3.5 → 4."},
 {"id": "w2-cs-07", "k": 2, "s": "CS", "t": "Data types", "q": "What is printed?", "c": "print(type(3 / 1))", "o": ["<class 'str'>", "<class 'int'>", "<class 'number'>", "<class 'float'>"], "a": 3, "w": "The / operator always returns a float, even when the division is exact: 3.0."},
 {"id": "w2-cs-08", "k": 2, "s": "CS", "t": "Data types", "q": "What is printed?", "c": "print(bool(\"False\"))", "o": ["0", "False", "True", "Error"], "a": 2, "w": "Any non-empty string is true, whatever it spells."},
 {"id": "w2-cs-09", "k": 2, "s": "CS", "t": "Data types", "q": "What is printed?", "c": "print(int(\"12\") + float(\"3\"))", "o": ["15.0", "123", "Error", "15"], "a": 0, "w": "int plus float gives a float: 12 + 3.0 = 15.0."},
 {"id": "w2-cs-10", "k": 2, "s": "CS", "t": "Data types", "q": "What is printed?", "c": "print(\"a\" < \"B\")", "o": ["False", "Error", "True", "None"], "a": 0, "w": "Strings compare by code: 'a' is 97 and 'B' is 66, so 97 < 66 is False."},
 {"id": "w2-cs-11", "k": 2, "s": "CS", "t": "Data types", "q": "Which of these Python types is mutable?", "o": ["int", "str", "list", "tuple"], "a": 2, "w": "A list can be changed in place; the other three cannot."},
 {"id": "w2-cs-12", "k": 2, "s": "CS", "t": "Tokens", "q": "Which is a valid Python identifier?", "o": ["class", "_total2", "2total", "total-2"], "a": 1, "w": "A name may begin with a letter or underscore; it cannot begin with a digit, hold a hyphen, or be a keyword."},
 {"id": "w2-cs-13", "k": 2, "s": "CS", "t": "Tokens", "q": "Which of these is NOT a Python keyword?", "o": ["pass", "lambda", "nonlocal", "integer"], "a": 3, "w": "The type is written int, and even int is a built-in name, not a keyword."},
 {"id": "w2-cs-14", "k": 2, "s": "CS", "t": "Tokens", "q": "Python is called dynamically typed because", "o": ["types are checked before the program runs", "a name takes the type of the value given to it at run time", "a variable can hold only one type for ever", "every variable must be declared with a type"], "a": 1, "w": "No declaration is needed; the same name can later refer to a value of another type."},
 {"id": "w2-cs-15", "k": 2, "s": "CS", "t": "Variables", "q": "What is printed?", "c": "a, b = 3, 4\na, b = b, a + b\nprint(a, b)", "o": ["4 3", "4 8", "4 7", "7 4"], "a": 2, "w": "The right side is worked out first with the old values: (4, 3 + 4), then both names are set."},

/* ================= state ================= */
const KEY="board-ready-v1";
let storeOK=true;
let S={start:"2026-11-23",ticks:{},w0:{},log:[],scores:[],ans:{},rubric:{},filter:"CS"};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){storeOK=false;}
Object.keys(S.ans).forEach(k=>{if(/^\d+$/.test(k))delete S.ans[k];});S.log.forEach(e=>{if(typeof e.q==="number")delete e.q;});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storeOK=false;}}

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromISO=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);};
const todayISO=()=>iso(new Date());
const nice=s=>fromISO(s).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
function where(){
  const idx=Math.round((fromISO(todayISO())-fromISO(S.start))/864e5);
  if(idx<0)return{idx,week:0,dow:0};
  return{idx,week:Math.min(8,Math.floor(idx/7)+1),dow:idx%7,past:idx>=56};
}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
const TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l5 5L20 6"/></svg>';
function tally(n,of){
  let s='<svg width="'+(of*9+10)+'" height="26" viewBox="0 0 '+(of*9+10)+' 26" aria-hidden="true" fill="none" stroke-linecap="round" stroke-width="2.6">';
  for(let i=0;i<Math.min(of,4);i++)s+='<path d="M'+(6+i*9)+' 4l-1 18" stroke="'+(i<n?"var(--chalk)":"rgba(255,255,255,.22)")+'"/>';
  if(of>=5)s+='<path d="M2 20L38 6" stroke="'+(n>=5?"var(--marigold)":"rgba(255,255,255,.22)")+'"/>';
  return s+"</svg>";
}

/* ================= today ================= */
function blocksFor(w){
  if(w.week===0)return null;
  const P=PLAN[w.week-1];
  if(w.dow===6)return[
    {id:"test",min:60,t:"Weekly test",h:"परख",d:P.test+". Exam conditions, no blanks."},
    {id:"review",min:45,t:"Review",h:"समीक्षा",d:"Every wrong and guessed question goes into the भूल-बही."},
    {id:"demo",min:30,t:"Demo lesson",h:"बोर्ड",d:"10 minutes at the board on: "+P.demo+". Then feedback."},
    {id:"ped",min:30,t:"Pedagogy revision",h:"शिक्षण",d:P.ped+". Then 15 MCQs."},
    {id:"next",min:15,t:"Plan next week",h:"आगे",d:"Name the two topics with the most entries. They get extra time."}];
  const r=ROT[w.dow];
  return[
    {id:"settle",min:5,t:"Settle",h:"ठहराव",d:"Phone away. Read yesterday's three भूल-बही entries aloud."},
    {id:"study",min:45,t:"CS study",h:"अध्ययन",d:P.cs[w.dow]+". Write, do not only read."},
    {id:"mcq",min:15,t:"CS questions",h:"अभ्यास",d:"This week's CS set in the Practice tab first, then 15 questions from your book. Against the clock."},
    {id:"rot",min:15,t:r[0],h:"साथ में",d:r[1]},
    {id:"close",min:10,t:"Close",h:"समापन",d:"Log each wrong or guessed question. Write tomorrow's one topic on a slip."}];
}
function renderBoard(){
  const w=where(),d=new Date();
  const line=LINES[(Math.floor(fromISO(todayISO())/864e5)%LINES.length+LINES.length)%LINES.length];
  let topicLabel,topic,meta,done=0,of=5;
  if(w.week===0){topicLabel="Before week 1";topic="Submit the form. Take the baseline paper.";meta="Week 0";
    done=WEEK0.filter(x=>S.w0[x[0]]).length;of=WEEK0.length;}
  else{const b=blocksFor(w),tk=S.ticks[todayISO()]||{};done=b.filter(x=>tk[x.id]).length;
    meta=(w.past?"After week 8":"Week "+w.week+" of 8")+" · "+DAYNAMES[w.dow];
    topicLabel=w.dow===6?"Sunday":"Today's one topic";
    topic=w.dow===6?"Test, review and the board":PLAN[w.week-1].cs[w.dow];}
  $("#board").innerHTML=
   '<div class="meta"><span>'+esc(d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"}))+'</span><span>'+esc(meta)+'</span></div>'+
   '<h1 class="line" lang="hi">'+esc(line[0])+'</h1><p class="gloss">'+esc(line[1])+'</p>'+
   '<div class="topic-label">'+esc(topicLabel)+'</div><div class="topic">'+esc(topic)+'</div>'+
   '<div class="tally">'+tally(done,Math.min(of,5))+'<span>'+done+' of '+of+' done today</span></div>';
}
function daysKept(){return Object.values(S.ticks).filter(t=>t.study||t.test).length;}
function viewToday(){
  const w=where();
  if(w.week===0){
    return '<h2 class="sec-title">Week 0 <span lang="hi">· तैयारी से पहले</span></h2><p class="sec-sub">Six things before the first study day, '+nice(S.start)+'.</p><div class="stack">'+
    WEEK0.map(x=>'<div class="block'+(S.w0[x[0]]?" done":"")+'" style="grid-template-columns:44px 1fr"><button class="tick" data-w0="'+x[0]+'" aria-pressed="'+!!S.w0[x[0]]+'" aria-label="Mark done: '+esc(x[1])+'">'+TICK+'</button><div><h3>'+esc(x[1])+'</h3><p>'+esc(x[2])+'</p></div></div>').join("")+

  }
  const b=blocksFor(w),tk=S.ticks[todayISO()]||{};
  const total=b.reduce((a,x)=>a+x.min,0);
  let h='<h2 class="sec-title">'+(w.dow===6?"Sunday's three hours":"Today's ninety minutes")+' <span lang="hi">· आज का क्रम</span></h2><p class="sec-sub">'+b.length+' blocks, '+total+' minutes. Start a timer, or simply tick when done.</p><div class="stack">';
  b.forEach(x=>{const run=T&&T.key===x.id;
    h+='<div class="block'+(tk[x.id]?" done":"")+(run?" running":"")+'" data-block="'+x.id+'"><button class="tick" data-tick="'+x.id+'" aria-pressed="'+!!tk[x.id]+'" aria-label="Mark done: '+esc(x.t)+'">'+TICK+'</button><div><h3>'+esc(x.t)+'<span class="hi" lang="hi">'+x.h+'</span></h3><p>'+esc(x.d)+'</p></div><button class="timer" data-start="'+x.id+'" data-min="'+x.min+'" aria-label="Timer for '+esc(x.t)+'">'+(run?"…":x.min+" min")+'</button></div>';});
  h+='</div>';
  if(w.dow!==6)h+='<p class="note">Only 60 minutes today? Do CS study for 35, CS questions for 15, and Close for 10. That is a full day.</p>';
  const k=daysKept();
  h+='<div class="kept"><b>'+k+'</b><span>'+(k===1?"day":"days")+' of study kept so far <span lang="hi">· निभाए हुए दिन</span></span></div>';
  if(!storeOK)h+='<p class="note">This browser is not saving your ticks. Open the link in Chrome to keep them.</p>';
  return h;
}

/* ================= timer ================= */
let T=null,TI=null;
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+":"+pad(s%60);}
function startTimer(key,min,kind){
  T={key,end:Date.now()+min*60000,total:min*60000,kind};
  clearInterval(TI);TI=setInterval(tickTimer,400);route();
}
function stopTimer(){T=null;clearInterval(TI);route();}
function tickTimer(){
  if(!T)return;const left=T.end-Date.now();
  if(T.kind==="block"){const el=document.querySelector('[data-start="'+T.key+'"]');if(el)el.textContent=fmt(left);}
  else{const el=$("#demoClock");if(el)el.textContent=fmt(left);
    const m=(T.total-left)/60000;document.querySelectorAll(".stage").forEach((s,i)=>s.classList.toggle("on",m>=STAGES[i][0]&&m<STAGES[i][1]));}
  if(left<=0){const k=T.key,kind=T.kind;T=null;clearInterval(TI);
    if(kind==="block"){const d=todayISO();S.ticks[d]=S.ticks[d]||{};S.ticks[d][k]=true;save();toast("Block complete. एक कदम और।");}
    else toast("Ten minutes. Recap should be on the board.");
    route();}
}

function viewPractice(){
  const secs=["CS","Pedagogy","English","Hindi","Reasoning","Numerical","GK","Literacy"];
  const weeks=[...new Set(QS.map(q=>q.k))];
  let pw=S.pw||Math.max(1,where().week);if(!weeks.includes(pw))pw=weeks.filter(k=>k<=pw).pop()||weeks[0];
  const all=QS.filter(q=>q.k===pw);
  if(!all.some(q=>q.s===S.filter))S.filter="CS";
  const answered=all.filter(q=>S.ans[q.id]!==undefined),right=answered.filter(q=>S.ans[q.id]===q.a).length;
  let h='<h2 class="sec-title">Week '+pw+' set <span lang="hi">· अभ्यास</span></h2><p class="sec-sub">'+all.length+' questions. Answered '+answered.length+', right '+right+'. No negative marking in the exam, so never leave a blank.</p><div class="chips" role="group" aria-label="Week">'+
    weeks.map(k=>'<button class="chip" data-pw="'+k+'" aria-pressed="'+(pw===k)+'">Week '+k+'</button>').join("")+'</div><div class="chips" role="group" aria-label="Section" style="margin-top:0">'+
    secs.filter(s=>all.some(q=>q.s===s)).map(s=>'<button class="chip" data-filter="'+s+'" aria-pressed="'+(S.filter===s)+'">'+s+' · '+all.filter(q=>q.s===s).length+'</button>').join("")+'</div><div class="stack">';
  all.filter(q=>q.s===S.filter).forEach(q=>{const a=S.ans[q.id],done=a!==undefined;
    h+='<div class="q"><div class="tag">'+esc(q.t)+'</div><h3>'+esc(q.q)+'</h3>'+(q.c?'<pre class="code">'+esc(q.c)+'</pre>':'')+'<div class="opts">'+
      q.o.map((o,j)=>'<button class="opt'+(done&&j===q.a?" right":"")+(done&&j===a&&a!==q.a?" wrong":"")+'" data-q="'+q.id+'" data-o="'+j+'"'+(done?" disabled":"")+'>'+esc(o)+'</button>').join("")+'</div>';
    if(done){const ok=a===q.a;h+='<p class="why'+(ok?"":" miss")+'"><b>'+(ok?"Right.":"Not this time.")+'</b> '+esc(q.w)+'</p>';
      if(!ok)h+='<div class="row" style="margin-top:10px"><button class="btn quiet" data-tolog="'+q.id+'">'+(S.log.some(e=>e.q===q.id)?"In your भूल-बही":"Add to भूल-बही")+'</button></div>';}
    h+='</div>';});
  h+='</div><div class="row" style="margin-top:16px"><button class="btn quiet" id="resetSet" data-wk="'+pw+'">Clear my week '+pw+' answers and try again</button></div><p class="note">A new set is added before each week begins. These sets open the topic; your book and full papers complete it.</p>';
  return h;
}

/* ================= log ================= */
function chart(){
  const pts=S.scores.map(s=>Math.round(s.got/s.of*100));
  const W=320,H=150,L=30,R=10,Tp=10,B=24,iw=W-L-R,ih=H-Tp-B,y=v=>Tp+ih-(v/100)*ih,x=i=>L+(pts.length<2?iw/2:i*iw/(pts.length-1));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly test scores in percent">';
  [0,50,100].forEach(v=>{s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--rule)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';});
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(60)+'" y2="'+y(60)+'" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(y(60)+12)+'" text-anchor="end">60 shortlist line (54 reserved)</text>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(79)+'" y2="'+y(79)+'" stroke="var(--good)" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(y(79)-5)+'" text-anchor="end">79 = 95 of 120, our target</text>';
  if(pts.length){s+='<polyline fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" points="'+pts.map((p,i)=>x(i)+","+y(p)).join(" ")+'"/>';
    pts.forEach((p,i)=>{const last=i===pts.length-1;s+='<circle cx="'+x(i)+'" cy="'+y(p)+'" r="'+(last?5:3.5)+'" fill="'+(last?"var(--marigold)":"var(--ink)")+'"/><text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(S.scores[i].label)+'</text>';});}
  else s+='<text x="'+(L+iw/2)+'" y="'+(Tp+ih/2)+'" text-anchor="middle">Your line begins with the baseline paper.</text>';
  return s+"</svg>";
}
function summaryText(){
  const open=S.log.filter(e=>e.right<2);
  let t="My week, from Board Ready\n";
  if(S.scores.length){const l=S.scores[S.scores.length-1];t+="Latest test ("+l.label+"): "+l.got+"/"+l.of+"\n";}
  t+="Days kept: "+daysKept()+"\nOpen entries: "+open.length+"\n";
  TYPES.forEach(k=>{const n=open.filter(e=>e.type===k).length;if(n)t+="- "+k+": "+n+"\n";});
  const by={};open.forEach(e=>by[e.topic]=(by[e.topic]||0)+1);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  if(top.length)t+="Heaviest topics: "+top.map(x=>x[0]+" ("+x[1]+")").join(", ")+"\n";
  return t;
}
function viewLog(){
  const today=todayISO(),open=S.log.filter(e=>e.right<2),cleared=S.log.length-open.length;
  const counts=TYPES.map(k=>open.filter(e=>e.type===k).length),max=Math.max(1,...counts);
  let reading="Enter each wrong or guessed question the same day. The pattern shows itself within a week.";
  if(open.length>=3){const top=TYPES[counts.indexOf(Math.max(...counts))];
    reading={"Concept gap":"Mostly concept gaps: give more of the 45 minutes to study before questions.","Half knowledge":"Mostly half knowledge: revise the same topic once more before moving on.","Misread":"Mostly misreads: slow the first reading, and underline the last line of each question.","Slip":"Mostly slips: write each step of a conversion or code trace; skip nothing in the head.","Time":"Mostly time: practise 15 questions in 12 minutes for a week."}[top];}
  let h='<h2 class="sec-title">भूल-बही <span>· Error log</span></h2><p class="sec-sub">A ledger of mistakes is a ledger of what will be right next time.</p>'+
   '<div class="card"><div class="row" style="justify-content:space-between"><b>'+open.length+' open · '+cleared+' cleared</b><button class="btn quiet" id="copySum">Copy my week</button></div><div class="bars">'+
   TYPES.map((k,i)=>'<div class="bar"><span>'+k+'</span><span><i style="width:'+(counts[i]/max*100)+'%"></i></span><span>'+counts[i]+'</span></div>').join("")+'</div><p class="note" style="margin-left:0">'+reading+'</p><textarea id="sumBox" hidden readonly aria-label="Week summary"></textarea></div>'+
   '<details class="card" style="margin-top:12px"><summary style="cursor:pointer;font-weight:600;min-height:28px">Add an entry</summary><form id="logForm">'+
   '<label for="lSec">Section</label><select id="lSec"><option>CS</option><option>Pedagogy</option><option>English</option><option>Hindi</option><option>Reasoning</option><option>Numerical</option><option>GK</option><option>Computer literacy</option></select>'+
   '<label for="lTopic">Topic</label><input type="text" id="lTopic" required placeholder="e.g. Boolean logic">'+
   '<label for="lType">What kind of mistake</label><select id="lType">'+TYPES.map(k=>'<option value="'+k+'">'+k+' ('+TYPEHELP[k]+')</option>').join("")+'</select>'+
   '<label for="lRests">What the right answer rests on</label><textarea id="lRests" placeholder="One line in your own words"></textarea>'+
   '<div class="row" style="margin-top:12px"><button class="btn" type="submit">Save entry</button></div></form></details>';
  h+='<div class="stack" style="margin-top:12px">';
  const list=open.slice().sort((a,b)=>a.retest<b.retest?-1:1);
  if(!list.length)h+='<p class="note">Nothing open. Wrong answers from the Practice tab land here with one tap.</p>';
  list.forEach(e=>{const due=e.retest<=today;
    h+='<div class="entry'+(due?" due":"")+'"><h3>'+esc(e.topic)+'</h3><div class="small">'+esc(e.sec)+' · logged '+nice(e.date)+'</div>'+(e.rests?'<p>'+esc(e.rests)+'</p>':'<p></p>')+
     '<span class="pill'+(due?" due":"")+'">'+(due?"Re-test today":"Re-test "+nice(e.retest))+'</span><span class="pill">right '+e.right+' of 2</span>'+
     '<div class="row" style="margin-top:10px"><select data-type="'+e.id+'" aria-label="Mistake type" style="width:auto;flex:1">'+TYPES.map(k=>'<option'+(k===e.type?" selected":"")+'>'+k+'</option>').join("")+'</select><button class="btn quiet" data-right="'+e.id+'">Got it right</button><button class="btn quiet" data-del="'+e.id+'" aria-label="Delete entry">Delete</button></div></div>';});
  h+='</div><h2 class="sec-title">Progress line <span lang="hi">· चढ़ती रेखा</span></h2><p class="sec-sub">One point for the baseline, then one each Sunday.</p><div class="card">'+chart()+
   '<form id="scoreForm" class="row" style="margin-top:10px;align-items:flex-end"><div style="flex:1.2;min-width:90px"><label for="sLabel">Test</label><input type="text" id="sLabel" required placeholder="Base, W1…" maxlength="6"></div><div style="flex:1;min-width:70px"><label for="sGot">Marks</label><input type="number" id="sGot" required min="0" max="120" inputmode="numeric"></div><div style="flex:1;min-width:70px"><label for="sOf">Out of</label><select id="sOf"><option>60</option><option>120</option></select></div><button class="btn" type="submit">Add</button></form>'+
   (S.scores.length?'<div class="row" style="margin-top:10px"><button class="btn quiet" id="undoScore">Remove last point</button></div>':'')+'</div>'+
   '<h2 class="sec-title">Keep a copy <span lang="hi">· सँभाल कर</span></h2><p class="sec-sub">Your work lives only in this browser on this phone. Copy it once a week, so a new phone or a cleared browser costs you nothing.</p><div class="card"><div class="row"><button class="btn quiet" id="bkCopy">Copy my data</button><button class="btn quiet" id="bkOpen">Restore from a copy</button></div><textarea id="bkBox" hidden aria-label="Saved copy" style="margin-top:10px"></textarea><div class="row" style="margin-top:10px"><button class="btn" id="bkLoad" hidden>Load this copy</button></div></div>';
  return h;
}

/* ================= demo ================= */
function viewDemo(){
  const w=where(),wk=Math.max(1,w.week),P=PLAN[wk-1],r=S.rubric[wk]||{};
  const total=RUBRIC.reduce((a,_,i)=>a+(r[i]||0),0),filled=RUBRIC.filter((_,i)=>r[i]).length;
  const run=T&&T.kind==="demo";
  let h='<h2 class="sec-title">Demo lesson <span lang="hi">· बोर्ड पर दस मिनट</span></h2><p class="sec-sub">The skill test is teaching at a chalkboard, marked Go or No Go. The written score decides the rank; the board decides whether that score counts. Its length is not announced, so we practise ten minutes every Sunday until the board is familiar ground.</p>'+
   '<div class="card"><div class="small" style="color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase">Week '+wk+' topic</div><h3 style="font-family:var(--display);font-size:22px;margin:2px 0 12px">'+esc(P.demo)+'</h3>'+
   '<div class="row" style="justify-content:space-between"><div class="bigclock" id="demoClock">'+(run?"…":"10:00")+'</div><button class="btn '+(run?"quiet":"gold")+'" id="demoBtn">'+(run?"Stop":"Start 10 minutes")+'</button></div></div>'+
   '<div class="stack" style="margin-top:12px">'+STAGES.map(s=>'<div class="stage"><div class="min">'+s[0]+' to '+s[1]+' min</div><div><b>'+s[2]+'</b><div style="color:var(--muted);font-size:14.5px">'+s[3]+'</div></div></div>').join("")+'</div>'+
   '<h2 class="sec-title">After the lesson <span lang="hi">· अपना आईना</span></h2><p class="sec-sub">Watch your recording once. Score each line from 1 to 4. Then name one thing to keep and one to change.</p><div class="card">'+
   RUBRIC.map((x,i)=>'<div class="rub"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><div class="marks" role="group" aria-label="'+x[0]+' score">'+[1,2,3,4].map(n=>'<button data-rub="'+i+'" data-n="'+n+'" aria-pressed="'+(r[i]===n)+'">'+n+'</button>').join("")+'</div></div>').join("")+
   '<p class="note" style="margin-left:0"><b style="color:var(--ink)">'+total+' of 32</b>'+(filled<8?" · "+(8-filled)+" lines left to score":" · saved for week "+wk)+'</p></div>'+
   '<p class="note">Record only for your own review. Check the medium and format of the skill test in the official notification.</p>';
  return h;
}

/* ================= routing and events ================= */
const VIEWS={today:viewToday,plan:viewPlan,practice:viewPractice,log:viewLog,"board-practice":viewDemo};
function route(){
  let v=location.hash.replace("#","");if(!VIEWS[v])v="today";
  renderBoard();$("#view").innerHTML=VIEWS[v]();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.getAttribute("href")==="#"+v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(T)tickTimer();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tick){const day=todayISO();S.ticks[day]=S.ticks[day]||{};S.ticks[day][d.tick]=!S.ticks[day][d.tick];if(T&&T.key===d.tick)T=null;save();route();}
  else if(d.w0){S.w0[d.w0]=!S.w0[d.w0];save();route();}
  else if(d.start){if(T&&T.key===d.start)stopTimer();else startTimer(d.start,Number(d.min),"block");}
  else if(d.filter){S.filter=d.filter;save();route();}
  else if(d.q!==undefined&&d.o!==undefined){S.ans[d.q]=Number(d.o);save();route();}
  else if(d.pw){S.pw=Number(d.pw);save();route();window.scrollTo(0,0);}
  else if(d.tolog!==undefined){const i=d.tolog,q=QS.find(x=>x.id===i);if(q&&!S.log.some(x=>x.q===i)){addEntry(q.s==="Literacy"?"Computer literacy":q.s,q.t,"Concept gap",q.w,i);toast("Added. Choose the mistake type in your भूल-बही.");}route();}
  else if(b.id==="resetSet"){QS.forEach(q=>{if(q.k===Number(d.wk))delete S.ans[q.id];});save();route();}
  else if(b.id==="bkCopy"){const t=JSON.stringify(S);const box=$("#bkBox");const show=()=>{box.hidden=false;box.readOnly=true;box.value=t;box.select();toast("Select and copy the text below. Keep it somewhere safe.");};
    try{navigator.clipboard.writeText(t).then(()=>toast("Copied. Paste it into a note or a message to yourself."),show);}catch(err){show();}}
  else if(b.id==="bkOpen"){const box=$("#bkBox");box.hidden=false;box.readOnly=false;box.value="";box.placeholder="Paste your saved copy here";$("#bkLoad").hidden=false;box.focus();}
  else if(b.id==="bkLoad"){try{const o=JSON.parse($("#bkBox").value);if(!o||typeof o!=="object"||!o.ticks||!Array.isArray(o.log))throw 0;S=Object.assign(S,o);save();toast("Restored. सब कुछ वापस आ गया।");route();}catch(err){toast("That text is not a saved copy. Paste the whole of it.");}}
  else if(d.right){const en=S.log.find(x=>x.id===d.right);if(en){en.right++;const n=new Date();n.setDate(n.getDate()+7);en.retest=iso(n);save();toast(en.right>=2?"Cleared. यह अब आपका है।":"Once more next week, then it is cleared.");route();}}
  else if(d.del){S.log=S.log.filter(x=>x.id!==d.del);save();route();}
  else if(b.id==="copySum"){const t=summaryText();const box=$("#sumBox");
    const show=()=>{box.hidden=false;box.value=t;box.select();toast("Select and copy the text below.");};
    try{navigator.clipboard.writeText(t).then(()=>toast("Copied. Paste it wherever you wish to share."),show);}catch(err){show();}}
  else if(b.id==="undoScore"){S.scores.pop();save();route();}
  else if(b.id==="demoBtn"){if(T&&T.kind==="demo")stopTimer();else startTimer("demo",10,"demo");}
  else if(d.rub!==undefined){const wk=Math.max(1,where().week);S.rubric[wk]=S.rubric[wk]||{};S.rubric[wk][d.rub]=Number(d.n);save();route();}
});
function addEntry(sec,topic,type,rests,q){
  const n=new Date();n.setDate(n.getDate()+7);
  S.log.push({id:"e"+Date.now()+Math.floor(Math.random()*999),date:todayISO(),sec,topic,type,rests,retest:iso(n),right:0,q});save();
}
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="logForm"){const t=$("#lTopic").value.trim();if(!t)return;addEntry($("#lSec").value,t,$("#lType").value,$("#lRests").value.trim());toast("Saved. Re-test in 7 days.");route();}
  else if(e.target.id==="scoreForm"){const of=Number($("#sOf").value),got=Number($("#sGot").value),label=$("#sLabel").value.trim();
    if(!label||isNaN(got)||got<0||got>of){toast("Marks must be between 0 and "+of+".");return;}
    S.scores.push({label,got,of});save();route();}
});
document.addEventListener("change",e=>{
  if(e.target.id==="startDate"&&e.target.value){S.start=e.target.value;save();route();}
  else if(e.target.dataset.type){const en=S.log.find(x=>x.id===e.target.dataset.type);if(en){en.type=e.target.value;save();route();}}
});
route();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a classroom chalkboard on top carrying the day's one line and one topic;
   below it, a ruled notebook page for the work. One column, phone first, tabs at the thumb. */
:root{
  --paper:#eef0ea; --card:#fbfcf8; --ink:#1d2a24; --muted:#5a695f; --rule:#cfd6cc;
  --board:#23382f; --board-edge:#1a2b24; --chalk:#f3f1e6; --chalk-dim:#b9c6ba;
  --marigold:#d99208; --marigold-ink:#3a2700; --ledge:#8a5a2b;
  --good:#2c7a4c; --warn:#b04f10; --good-bg:#e2f1e6; --warn-bg:#f8e7d8;
  --display:"Kalam","Mukta","Noto Sans Devanagari",cursive;
  --body:"Mukta","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131e19; --card:#1b2a23; --ink:#e8ecdf; --muted:#9db0a3; --rule:#2e4338;
    --board:#294237; --board-edge:#0d1612; --chalk:#f3f1e6; --chalk-dim:#b3c2b5;
    --marigold:#f0b53a; --marigold-ink:#2b1d00; --ledge:#6f4a25;
    --good:#6fc48d; --warn:#f09a5c; --good-bg:#1f3a2a; --warn-bg:#3d2a1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131e19; --card:#1b2a23; --ink:#e8ecdf; --muted:#9db0a3; --rule:#2e4338;
  --board:#294237; --board-edge:#0d1612; --chalk:#f3f1e6; --chalk-dim:#b3c2b5;
  --marigold:#f0b53a; --marigold-ink:#2b1d00; --ledge:#6f4a25;
  --good:#6fc48d; --warn:#f09a5c; --good-bg:#1f3a2a; --warn-bg:#3d2a1a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:92px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

/* ---------- the board ---------- */
.board{background:
    radial-gradient(120% 80% at 20% 10%,rgba(255,255,255,.07),transparent 60%),
    radial-gradient(90% 60% at 85% 90%,rgba(255,255,255,.05),transparent 60%),
    var(--board);
  color:var(--chalk);border:6px solid var(--board-edge);border-bottom:0;border-radius:10px 10px 0 0;
  margin-top:16px;padding:18px 18px 22px;position:relative}
.ledge{height:12px;background:linear-gradient(var(--ledge),color-mix(in srgb,var(--ledge) 70%,#000));border-radius:0 0 6px 6px;position:relative;margin-bottom:20px}
.ledge::after{content:"";position:absolute;right:26px;top:-5px;width:34px;height:7px;border-radius:3px;background:var(--chalk);box-shadow:-46px 1px 0 -1px var(--marigold)}
.board .meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--chalk-dim);letter-spacing:.02em}
.board .line{font-family:var(--display);font-size:25px;line-height:1.35;margin:12px 0 4px;font-weight:400}
.board .gloss{font-size:13.5px;color:var(--chalk-dim);margin:0 0 14px}
.board .topic-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--marigold)}
.board .topic{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.3;margin-top:2px}
.board .tally{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--chalk-dim)}
@media (prefers-reduced-motion:no-preference){
  .board .line{animation:write 1.1s ease-out both}
  @keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
}

/* ---------- notebook ---------- */
.sec-title{font-family:var(--display);font-weight:700;font-size:20px;margin:22px 0 2px}
.sec-sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.block{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:8px;padding:12px}
.block.done{border-left-color:var(--good)}
.block.running{border-left-color:var(--marigold)}
.tick{width:44px;height:44px;border-radius:8px;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{width:26px;height:26px;stroke:var(--good);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg)}
.tick[aria-pressed="true"] svg{opacity:1}
.block h3{font-size:16px;font-weight:600}
.block .hi{font-family:var(--display);color:var(--muted);font-size:14px;font-weight:400;margin-left:6px}
.block p{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.timer{min-width:74px;min-height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:0 10px}
.block.running .timer{background:var(--marigold);color:var(--marigold-ink);border-color:var(--marigold)}
.note{font-size:13.5px;color:var(--muted);margin:12px 2px 0}
.kept{display:flex;gap:10px;align-items:baseline;margin-top:16px;padding:12px 14px;border-radius:8px;background:var(--good-bg);color:var(--ink)}
.kept b{font-family:var(--display);font-size:24px;color:var(--good)}

.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.gold{background:var(--marigold);border-color:var(--marigold);color:var(--marigold-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--rule);background:var(--card);font-weight:500;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--board);color:var(--chalk);border-color:var(--board)}

/* plan */
details.week{background:var(--card);border:1px solid var(--rule);border-radius:8px}
details.week[data-now]{border-color:var(--marigold);box-shadow:inset 4px 0 0 var(--marigold)}
details.week summary{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer;min-height:48px}
details.week summary::-webkit-details-marker{display:none}
details.week summary b{font-family:var(--display);font-size:18px}
details.week summary span{color:var(--muted);font-size:13.5px;text-align:right}
.week-body{padding:0 14px 14px;border-top:1px dashed var(--rule)}
.week-body ol{margin:10px 0 8px;padding-left:22px}
.week-body li{margin:3px 0}
.kv{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;font-size:14.5px;margin-top:8px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* practice */
.q{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.q .tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.q h3{font-size:16.5px;font-weight:600;margin:4px 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:46px;padding:8px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.opt:disabled{cursor:default;opacity:1}
.why{margin:10px 0 0;font-size:14.5px;padding:10px 12px;border-radius:8px;background:var(--paper)}
.why b{color:var(--good)} .why.miss b{color:var(--warn)}

/* log */
label{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);padding:8px 10px}
textarea{min-height:72px;resize:vertical}
.entry{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px}
.entry.due{border-left:4px solid var(--marigold)}
.entry h3{font-size:16px;font-weight:600}
.entry .small{font-size:13.5px;color:var(--muted)}
.entry p{margin:6px 0 8px;font-size:14.5px}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:12px;border:1px solid var(--rule);margin-right:6px;font-variant-numeric:tabular-nums}
.pill.due{background:var(--marigold);color:var(--marigold-ink);border-color:var(--marigold)}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:grid;grid-template-columns:118px 1fr 28px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--board);min-width:2px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
svg.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}

/* board practice */
.stage{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
.stage.on{border-color:var(--marigold);box-shadow:inset 4px 0 0 var(--marigold)}
.stage .min{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.rub{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.rub:last-child{border-bottom:0}
.rub b{font-weight:600} .rub small{display:block;color:var(--muted);font-size:13.5px}
.marks{display:flex;gap:4px}
.marks button{width:38px;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.marks button[aria-pressed="true"]{background:var(--board);color:var(--chalk);border-color:var(--board)}
.bigclock{font-family:var(--display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--rule);z-index:5}
nav.tabs div{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:500;border-top:3px solid transparent;margin-top:-1px}
nav.tabs a i{font-style:normal;font-family:var(--display);font-size:16px;line-height:1.2;color:inherit}
nav.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--marigold)}
footer{margin:28px 0 8px;font-size:13px;color:var(--muted);text-align:left}
footer .from{font-family:var(--display);font-size:16px;color:var(--ink);display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:88%}
[hidden]{display:none!important}
</style>
</head>

/* ================= timer ================= */
let T=null,TI=null;
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+":"+pad(s%60);}
function startTimer(key,min,kind){
  T={key,end:Date.now()+min*60000,total:min*60000,kind};
  clearInterval(TI);TI=setInterval(tickTimer,400);route();
}
function stopTimer(){T=null;clearInterval(TI);route();}
function tickTimer(){
  if(!T)return;const left=T.end-Date.now();
  if(T.kind==="block"){const el=document.querySelector('[data-start="'+T.key+'"]');if(el)el.textContent=fmt(left);}
  else{const el=$("#demoClock");if(el)el.textContent=fmt(left);
    const m=(T.total-left)/60000;document.querySelectorAll(".stage").forEach((s,i)=>s.classList.toggle("on",m>=STAGES[i][0]&&m<STAGES[i][1]));}
  if(left<=0){const k=T.key,kind=T.kind;T=null;clearInterval(TI);
    if(kind==="block"){const d=todayISO();S.ticks[d]=S.ticks[d]||{};S.ticks[d][k]=true;save();toast("Block complete. शाबाश।");}
    else toast("Ten minutes. Recap should be on the board.");
    route();}
}

  const total=RUBRIC.reduce((a,_,i)=>a+(r[i]||0),0),filled=RUBRIC.filter((_,i)=>r[i]).length;
  const run=T&&T.kind==="demo";
  let h='<h2 class="sec-title">Demo lesson <span lang="hi">· बोर्ड पर दस मिनट</span></h2><p class="sec-sub">The skill test is ten minutes of teaching at a chalkboard. Practise it every Sunday so the board becomes familiar ground.</p>'+
   '<div class="card"><div class="small" style="color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase">Week '+wk+' topic</div><h3 style="font-family:var(--display);font-size:22px;margin:2px 0 12px">'+esc(P.demo)+'</h3>'+
   '<div class="row" style="justify-content:space-between"><div class="bigclock" id="demoClock">'+(run?"…":"10:00")+'</div><button class="btn '+(run?"quiet":"gold")+'" id="demoBtn">'+(run?"Stop":"Start 10 minutes")+'</button></div></div>'+
   '<div class="stack" style="margin-top:12px">'+STAGES.map(s=>'<div class="stage"><div class="min">'+s[0]+' to '+s[1]+' min</div><div><b>'+s[2]+'</b><div style="color:var(--muted);font-size:14.5px">'+s[3]+'</div></div></div>').join("")+'</div>'+
   '<h2 class="sec-title">After the lesson <span lang="hi">· अपना आईना</span></h2><p class="sec-sub">Watch your recording once. Score each line from 1 to 4. Then name one thing to keep and one to change.</p><div class="card">'+
   RUBRIC.map((x,i)=>'<div class="rub"><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><div class="marks" role="group" aria-label="'+x[0]+' score">'+[1,2,3,4].map(n=>'<button data-rub="'+i+'" data-n="'+n+'" aria-pressed="'+(r[i]===n)+'">'+n+'</button>').join("")+'</div></div>').join("")+
   '<p class="note" style="margin-left:0"><b style="color:var(--ink)">'+total+' of 32</b>'+(filled<8?" · "+(8-filled)+" lines left to score":" · saved for week "+wk)+'</p></div>'+
   '<p class="note">Record only for your own review. Check the medium and format of the skill test in the official notification.</p>';
  return h;
}

/* ================= routing and events ================= */
const VIEWS={today:viewToday,plan:viewPlan,practice:viewPractice,log:viewLog,"board-practice":viewDemo};
function route(){
  let v=location.hash.replace("#","");if(!VIEWS[v])v="today";
  renderBoard();$("#view").innerHTML=VIEWS[v]();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.getAttribute("href")==="#"+v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(T)tickTimer();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tick){const day=todayISO();S.ticks[day]=S.ticks[day]||{};S.ticks[day][d.tick]=!S.ticks[day][d.tick];if(T&&T.key===d.tick)T=null;save();route();}
  else if(d.w0){S.w0[d.w0]=!S.w0[d.w0];save();route();}
  else if(d.start){if(T&&T.key===d.start)stopTimer();else startTimer(d.start,Number(d.min),"block");}
  else if(d.filter){S.filter=d.filter;save();route();}
  else if(d.q!==undefined&&d.o!==undefined){S.ans[d.q]=Number(d.o);save();route();}
  else if(d.tolog!==undefined){const i=Number(d.tolog),q=QS[i];if(!S.log.some(x=>x.q===i)){addEntry(q.s,q.t,"Concept gap",q.w,i);toast("Added. Choose the mistake type in your भूल-बही.");}route();}
  else if(b.id==="resetSet"){S.ans={};save();route();}
  else if(d.right){const en=S.log.find(x=>x.id===d.right);if(en){en.right++;const n=new Date();n.setDate(n.getDate()+7);en.retest=iso(n);save();toast(en.right>=2?"Cleared. यह अब आपका है।":"Once more next week, then it is cleared.");route();}}
  else if(d.del){S.log=S.log.filter(x=>x.id!==d.del);save();route();}
  else if(b.id==="copySum"){const t=summaryText();const box=$("#sumBox");
    const show=()=>{box.hidden=false;box.value=t;box.select();toast("Select and copy the text below.");};
    try{navigator.clipboard.writeText(t).then(()=>toast("Copied. Paste it wherever you wish to share."),show);}catch(err){show();}}
  else if(b.id==="undoScore"){S.scores.pop();save();route();}
  else if(b.id==="demoBtn"){if(T&&T.kind==="demo")stopTimer();else startTimer("demo",10,"demo");}
  else if(d.rub!==undefined){const wk=Math.max(1,where().week);S.rubric[wk]=S.rubric[wk]||{};S.rubric[wk][d.rub]=Number(d.n);save();route();}
});
function addEntry(sec,topic,type,rests,q){
  const n=new Date();n.setDate(n.getDate()+7);
  S.log.push({id:"e"+Date.now()+Math.floor(Math.random()*999),date:todayISO(),sec,topic,type,rests,retest:iso(n),right:0,q});save();
}
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="logForm"){const t=$("#lTopic").value.trim();if(!t)return;addEntry($("#lSec").value,t,$("#lType").value,$("#lRests").value.trim());toast("Saved. Re-test in 7 days.");route();}
  else if(e.target.id==="scoreForm"){const of=Number($("#sOf").value),got=Number($("#sGot").value),label=$("#sLabel").value.trim();
    if(!label||isNaN(got)||got<0||got>of){toast("Marks must be between 0 and "+of+".");return;}
    S.scores.push({label,got,of});save();route();}
});
document.addEventListener("change",e=>{
  if(e.target.id==="startDate"&&e.target.value){S.start=e.target.value;save();route();}
  else if(e.target.dataset.type){const en=S.log.find(x=>x.id===e.target.dataset.type);if(en){en.type=e.target.value;save();route();}}
});
route();
</script>
